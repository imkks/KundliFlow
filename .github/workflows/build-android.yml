name: Build Android APK

on:
  push:
    branches:
      - build-andrioid
      - main
    paths:
      - 'apps/android/**'
      - 'packages/content/android/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches:
      - build-andrioid
      - main
    paths:
      - 'apps/android/**'
      - 'packages/content/android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  android-apk:
    name: Test & Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses & ensure API 35
        run: |
          SDKMANAGER=$(command -v sdkmanager || find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests & build Debug APK
        working-directory: apps/android
        run: gradle testDebugUnitTest assembleDebug -PapiBaseUrl=https://129.225.104.43.sslip.io --no-daemon

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kundliflow-android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
