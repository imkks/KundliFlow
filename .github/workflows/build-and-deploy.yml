name: Build, Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kundliflow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1. Test everything & build standalone Oracle Cloud API artifact
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit & ephemeris conformance tests
        run: pnpm test

      - name: Build Backend API (@astro/api)
        run: pnpm --filter @astro/api build

      - name: Package standalone Oracle Cloud API bundle
        run: |
          mkdir -p build-artifacts/kundliflow-api/apps/api/dist
          mkdir -p build-artifacts/kundliflow-api/packages/content
          mkdir -p build-artifacts/kundliflow-api/data
          cp apps/api/dist/index.js build-artifacts/kundliflow-api/apps/api/dist/index.js
          cp -r packages/content/strength.yaml packages/content/rules packages/content/topics packages/content/kb build-artifacts/kundliflow-api/packages/content/
          cp .env.example build-artifacts/kundliflow-api/.env.example

          cat <<'EOF' > build-artifacts/kundliflow-api/package.json
          {
            "name": "kundliflow-api-runtime",
            "version": "1.0.0",
            "private": true,
            "type": "module",
            "scripts": {
              "start": "node apps/api/dist/index.js"
            },
            "dependencies": {
              "better-sqlite3": "^11.5.0",
              "js-yaml": "^5.5.0",
              "zod": "^3.23.0"
            }
          }
          EOF

          cat <<'EOF' > build-artifacts/kundliflow-api/start.sh
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$(dirname "$0")"
          mkdir -p data
          [ -f .env ] || cp .env.example .env
          if [ -f .env ]; then
            set -a
            source .env
            set +a
          fi
          if [ ! -d node_modules ]; then
            echo "Installing 3 runtime packages (better-sqlite3, js-yaml, zod)..."
            npm install --omit=dev
          fi
          if command -v pm2 >/dev/null 2>&1; then
            pm2 describe kundliflow-api >/dev/null 2>&1 \
              && pm2 restart kundliflow-api --update-env \
              || pm2 start apps/api/dist/index.js --name kundliflow-api --cwd "$(pwd)"
            pm2 save
            echo "KundliFlow API running via PM2 on http://0.0.0.0:${PORT:-8787}"
          else
            echo "Starting KundliFlow API on http://0.0.0.0:${PORT:-8787}..."
            node apps/api/dist/index.js
          fi
          EOF
          chmod +x build-artifacts/kundliflow-api/start.sh

          tar -czf build-artifacts/kundliflow-api-bundle.tar.gz -C build-artifacts kundliflow-api

      - name: Upload Backend API Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kundliflow-api-bundle
          path: build-artifacts/kundliflow-api-bundle.tar.gz
          retention-days: 30

  # 2. Build thin frontend & upload Pages artifact
  build-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Thin Frontend (@astro/web)
        env:
          VITE_BASE_PATH: /KundliFlow/
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || vars.VITE_API_URL || 'http://localhost:8787' }}
          VITE_API_URL: ${{ vars.VITE_API_BASE_URL || vars.VITE_API_URL || 'http://localhost:8787' }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || '' }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY || vars.VITE_GOOGLE_MAPS_API_KEY || '' }}
        run: |
          echo "Building frontend with API URL: $VITE_API_BASE_URL"
          pnpm --filter @astro/web build

      - name: Verify ultra-light frontend (0 WASM bundles)
        run: |
          if ls apps/web/dist/assets/*.wasm 1> /dev/null 2>&1; then
            echo "ERROR: WASM ephemeris leaked into frontend bundle!"
            exit 1
          fi
          echo "Verified: 0 WASM files in apps/web/dist/assets/"
          ls -lh apps/web/dist/assets/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  # 3. Deploy to GitHub Pages (Separate job ensures artifact metadata is fully indexed)
  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 4. Deploy API artifact to Oracle Cloud Server
  deploy-server:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Download Backend API Artifact
        uses: actions/download-artifact@v4
        with:
          name: kundliflow-api-bundle
          path: ./release

      - name: Check Oracle SSH secrets
        id: check
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST || vars.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          if [ -z "$ORACLE_HOST" ] || [ -z "$ORACLE_SSH_KEY" ]; then
            echo "ORACLE_HOST or ORACLE_SSH_KEY not set — skipping SSH push."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload & restart API on Oracle Cloud VM
        if: steps.check.outputs.ready == 'true'
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST || vars.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER || vars.ORACLE_USER || 'ubuntu' }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          PORT: ${{ vars.PORT || '8787' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'kundliflow-session-prod-key' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || vars.GOOGLE_CLIENT_ID || vars.VITE_GOOGLE_CLIENT_ID || '654362464468-7sdsra0madqrhmpntsamcbiuc707qccn.apps.googleusercontent.com' }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN || secrets.DEEPSEEK_API_KEY || secrets.ANTHROPIC_API_KEY || '' }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL || 'https://api.deepseek.com/anthropic' }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'deepseek-flash' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GEMINI_API_KEY || secrets.OPENAI_API_KEY || '' }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || '' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || '' }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # Create production .env file on runner with secrets injected
          printf "%s\n" \
            "PORT=${PORT}" \
            "JWT_SECRET=${JWT_SECRET}" \
            "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" \
            "ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL}" \
            "ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN}" \
            "ANTHROPIC_MODEL=${ANTHROPIC_MODEL}" \
            "LLM_API_KEY=${LLM_API_KEY}" \
            "LLM_BASE_URL=${LLM_BASE_URL}" \
            "LLM_MODEL=${LLM_MODEL}" > /tmp/deploy.env

          scp -i ~/.ssh/oracle_key ./release/kundliflow-api-bundle.tar.gz "${ORACLE_USER}@${ORACLE_HOST}:/tmp/kundliflow-api-bundle.tar.gz"
          scp -i ~/.ssh/oracle_key /tmp/deploy.env "${ORACLE_USER}@${ORACLE_HOST}:/tmp/deploy.env"

          ssh -i ~/.ssh/oracle_key "${ORACLE_USER}@${ORACLE_HOST}" "mkdir -p ~/kundliflow-api && tar -xzf /tmp/kundliflow-api-bundle.tar.gz -C ~ && rm -f /tmp/kundliflow-api-bundle.tar.gz && mv /tmp/deploy.env ~/kundliflow-api/.env && cd ~/kundliflow-api && bash start.sh"
