name: Release Android Signed Bundle (AAB)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Integer Android versionCode (must increase for every Play Store upload, e.g. 1)'
        required: true
        type: string
        default: '1'
      version_name:
        description: 'Human-readable versionName (e.g. 1.0.0)'
        required: true
        type: string
        default: '1.0.0'
      api_base_url:
        description: 'Production API base URL'
        required: false
        type: string
        default: 'https://129.225.104.43.sslip.io'

jobs:
  android-release:
    name: Build Signed Release AAB & APK (com.evertrail.kundliflow)
    runs-on: ubuntu-latest

    steps:
      - name: Validate version inputs
        shell: bash
        run: |
          if ! [[ "${{ inputs.version_code }}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Error: version_code must be a positive integer (got '${{ inputs.version_code }}')."
            exit 1
          fi
          if [ -z "${{ inputs.version_name }}" ]; then
            echo "Error: version_name cannot be empty."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses & ensure API 35
        run: |
          SDKMANAGER=$(command -v sdkmanager || find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Decode release signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Error: Missing GitHub Secret ANDROID_KEYSTORE_BASE64."
            echo "Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/release.jks"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run tests & build signed Release AAB + APK
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY || secrets.VITE_GOOGLE_MAPS_API_KEY || vars.VITE_GOOGLE_MAPS_API_KEY || '' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || vars.GOOGLE_CLIENT_ID || vars.VITE_GOOGLE_CLIENT_ID || '654362464468-7sdsra0madqrhmpntsamcbiuc707qccn.apps.googleusercontent.com' }}
        run: |
          gradle testDebugUnitTest bundleRelease assembleRelease \
            -PversionCode="${{ inputs.version_code }}" \
            -PversionName="${{ inputs.version_name }}" \
            -PapiBaseUrl="${{ inputs.api_base_url }}" \
            --no-daemon

      - name: Clean up temporary keystore
        if: always()
        shell: bash
        run: rm -f "${{ runner.temp }}/release.jks"

      - name: Upload Signed Play Store Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: kundliflow-v${{ inputs.version_name }}-vc${{ inputs.version_code }}-release-aab
          path: apps/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: kundliflow-v${{ inputs.version_name }}-vc${{ inputs.version_code }}-release-apk
          path: apps/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
