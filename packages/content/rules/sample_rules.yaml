      theme: home_mother
      polarity: challenging
      base_strength: 55
      statement: Rahu in the 4th house is traditionally read as restlessness or unusual circumstances around home and inner peace.
      modifiers:
        - when:
            fact: conjunction
            planet: rahu
            with: [venus, mercury, sun]
            orb_lte: 3
          strength: 5
          phrase: The conjunction sits close, so the themes of the joined planet are colored by Rahu.
