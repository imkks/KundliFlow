  # --- Checklist II: D1 vs D9 Crossover Audits ---
  - id: kn_rao.crossover.d1_exalt_d9_debil
    kind: kn_rao_pattern
    school: parashari
    source: "K.N. Rao, Astrology, Destiny and the Wheel of Time (Checklist II, p. 83)"
    reviewed: true
    when:
      all:
        - fact: varga
          crossover: d1_exalt_d9_debil
    effect:
      theme: self
      polarity: mixed
      base_strength: 62
      statement: A planet exalted in the Rashi (D1) chart yet debilitated in Navamsha (D9) signals high surface promise that requires inner resilience during its Dasha, as deeper follow-through can feel tested.

  - id: kn_rao.crossover.d1_debil_d9_strong
