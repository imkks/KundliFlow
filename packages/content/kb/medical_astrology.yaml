items:
  - id: medical.drekkana_zones
    type: concept_note
    text: "Dr. K.S. Charak Medical Astrology (Ch. XXIV): The rising Drekkana (D3) divides the 12 houses into three physiological zones: 1st Drekkana (0°-10°) covers Head to Neck; 2nd Drekkana (10°-20°) covers Chest to Navel; 3rd Drekkana (20°-30°) covers Pelvis to Feet. This decanate matrix localizes physical symptoms with exact anatomical precision."
    houses: "1,6,8"
    themes: "health_routine"
    school: parashari
    source: "Dr. K.S. Charak Elements of Vedic Astrology (Ch. XXIV)"
    reviewed: 1

  - id: medical.tridosha_constitution
    type: concept_note
    text: "Planetary Tridosha Significations: Pitta (fire, metabolic heat, bile) is ruled by Sun, Mars, and Ketu. Kapha (water/earth, mucous, structural lubrication) is ruled by Moon, Venus, and Jupiter. Vata (air/ether, nervous transmission, dry movement) is ruled by Saturn, Rahu, and Mercury. Predominance of afflicted planets indicates constitutional imbalance."
    houses: "1,6"
    themes: "health_routine"
    school: parashari
    source: "Dr. K.S. Charak Elements of Vedic Astrology (Ch. XXIV)"
    reviewed: 1

